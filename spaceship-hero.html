<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowBridge — Spaceship Command Center</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<meta name="description" content="ShadowBridge Cybersecurity Command Center — 3D spaceship interface to full-spectrum security monitoring.">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060810;
  --surface:#0d1117;
  --surface2:#111827;
  --border:#1e2738;
  --fg:#e2e8f0;
  --muted:#6b7280;
  --cyan:#00d4ff;
  --cyan2:#00ff9d;
  --red:#ff3b5c;
  --orange:#ff8c42;
  --purple:#8b5cf6;
  --yellow:#fbbf24;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI','Inter',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;}

/* ── SCANLINE OVERLAY ── */
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.012) 2px,rgba(0,212,255,.012) 4px);
  pointer-events:none;z-index:9999;
}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(6,8,16,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,212,255,.12);
  padding:14px 48px;display:flex;align-items:center;justify-content:space-between;
}
.nav-logo{
  font-size:1rem;font-weight:800;letter-spacing:4px;text-decoration:none;
  color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.nav-logo .logo-icon{
  width:28px;height:28px;border:2px solid var(--cyan);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:.9rem;
  box-shadow:0 0 12px rgba(0,212,255,.4);
}
.nav-links{display:flex;gap:32px;align-items:center;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.82rem;letter-spacing:.5px;transition:.2s;text-transform:uppercase;}
.nav-links a:hover{color:var(--cyan);}
.btn{display:inline-block;border-radius:4px;padding:8px 22px;font-size:.8rem;font-weight:700;text-decoration:none;cursor:pointer;transition:.2s;border:none;letter-spacing:1px;text-transform:uppercase;}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#060810;font-weight:800;}
.btn-primary:hover{box-shadow:0 0 24px rgba(0,212,255,.5);transform:translateY(-1px);}
.btn-outline{border:1px solid rgba(0,212,255,.4);color:var(--cyan);background:transparent;}
.btn-outline:hover{border-color:var(--cyan);background:rgba(0,212,255,.08);box-shadow:0 0 16px rgba(0,212,255,.2);}

/* ── HERO SECTION WITH SPACESHIP ── */
.hero-section{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(135deg,#0a0e27 0%,#1a1a3e 50%,#0d1b2a 100%);
}

.hero-stars{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  width:2px;height:2px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  animation:twinkle 3s infinite;
}

@keyframes twinkle{
  0%,100%{opacity:0.3;}
  50%{opacity:1;}
}

.spaceship-container{
  position:relative;
  width:100%;
  max-width:1200px;
  height:500px;
  perspective:1200px;
  z-index:10;
  margin:0 auto;
}

.spaceship{
  position:absolute;
  left:50%;
  top:50%;
  transform:translateX(-50%) translateY(-50%) rotateX(15deg) rotateY(-20deg) rotateZ(5deg);
  width:400px;
  height:300px;
  transform-style:preserve-3d;
  animation:hover 6s ease-in-out infinite;
}

@keyframes hover{
  0%,100%{transform:translateX(-50%) translateY(-50%) rotateX(15deg) rotateY(-20deg) rotateZ(5deg);}
  50%{transform:translateX(-50%) translateY(-70px) rotateX(15deg) rotateY(-20deg) rotateZ(5deg);}
}

.hull{
  position:absolute;
  width:100%;height:100%;
  background:linear-gradient(135deg,#1a3a52 0%,#0d5a7f 50%,#082a3d 100%);
  border:2px solid #00ff88;
  border-radius:50% 50% 30% 30%;
  box-shadow:0 0 40px rgba(0,255,136,.6),inset 0 0 40px rgba(0,255,136,.2),0 0 80px rgba(0,100,255,.4);
  transform:translateZ(50px);
}

.cockpit{
  position:absolute;
  top:20%;left:50%;
  transform:translateX(-50%) translateZ(60px);
  width:80px;height:80px;
  background:radial-gradient(circle at 30% 30%,#00ff88,#004d33);
  border-radius:50%;border:2px solid #00ff88;
  box-shadow:inset 0 0 20px rgba(0,255,136,.8),0 0 30px rgba(0,255,136,.6);
}

.scan-line{
  position:absolute;
  width:100%;height:2px;
  background:linear-gradient(90deg,transparent,#00ff88,transparent);
  top:40%;left:0;
  animation:scan 3s linear infinite;
}

@keyframes scan{
  0%{top:0%;}
  100%{top:100%;}
}

.thruster{
  position:absolute;
  width:30px;height:60px;
  background:linear-gradient(180deg,#ff6b00,#ff0000,transparent);
  border:1px solid #ff6b00;
  bottom:10%;
  filter:blur(8px);
  animation:thrust .6s ease-in-out infinite;
}

.thruster-left{left:15%;}
.thruster-right{right:15%;}

@keyframes thrust{
  0%,100%{height:60px;opacity:0.4;}
  50%{height:100px;opacity:0.8;}
}

.hero-overlay{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:600px;
  text-align:center;
  z-index:20;
  animation:fadeInUp .8s ease-out;
}

@keyframes fadeInUp{
  from{opacity:0;transform:translateX(-50%) translateY(20px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}

.hero-overlay h1{
  font-size:clamp(2rem,5vw,3.5rem);
  font-weight:900;
  margin-bottom:20px;
  letter-spacing:-1px;
  text-shadow:0 0 30px rgba(0,212,255,.5);
}

.hero-overlay .hl-cyan{color:var(--cyan);}
.hero-overlay .hl-green{color:var(--cyan2);}

.hero-overlay p{
  color:var(--muted);
  font-size:1rem;
  margin-bottom:32px;
  line-height:1.6;
  max-width:500px;
  margin-left:auto;
  margin-right:auto;
}

.hero-cta{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
}

.hero-cta .btn{
  padding:13px 32px;
  font-size:.88rem;
}

@media(max-width:768px){
  nav{padding:12px 20px;}
  .spaceship{transform:translateX(-50%) translateY(-50%) scale(0.7) rotateX(15deg) rotateY(-20deg) rotateZ(5deg);}
  .spaceship-container{height:350px;}
  .hero-overlay{bottom:20px;width:95%;}
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <a class="nav-logo" href="/">
    <div class="logo-icon">◈</div>
    Shadow<span style="color:var(--fg);">Bridge</span>
  </a>
  <div class="nav-links">
    <a href="/#modules">Arzenál</a>
    <a href="/#tiers">Cenník</a>
    <a href="/setup.html">Dokumentácia</a>
    <a href="/" class="btn btn-outline" style="padding:6px 18px;">Späť na web</a>
  </div>
</nav>

<!-- ── HERO WITH SPACESHIP ── -->
<div class="hero-section">
  <div class="hero-stars" id="stars"></div>

  <div class="spaceship-container">
    <div class="spaceship" id="spaceship">
      <div class="hull">
        <div class="cockpit"></div>
        <div class="scan-line"></div>
        <div class="thruster thruster-left"></div>
        <div class="thruster thruster-right"></div>
      </div>
    </div>
  </div>

  <div class="hero-overlay">
    <h1>
      <span class="hl-cyan">Kompletný</span><br>
      <span class="hl-green">Kybernetický Arzenál</span>
    </h1>
    <p>12 integrovaných modulov. 100+ bezpečnostných nástrojov. Jedno velíne. Jednou kliknutím aktivované.</p>
    <div class="hero-cta">
      <a href="/#tiers" class="btn btn-primary">Začať teraz →</a>
      <a href="/" class="btn btn-outline">Všetky funkcie</a>
    </div>
  </div>
</div>

<script>
// Generate starfield
const starsContainer = document.getElementById('stars');
for(let i=0;i<80;i++){
  const star=document.createElement('div');
  star.className='star';
  star.style.left=Math.random()*100+'%';
  star.style.top=Math.random()*100+'%';
  star.style.animationDelay=Math.random()*3+'s';
  starsContainer.appendChild(star);
}

// Mouse parallax tracking
const spaceship=document.getElementById('spaceship');
document.addEventListener('mousemove',(e)=>{
  const x=(e.clientX/window.innerWidth-0.5)*30;
  const y=(e.clientY/window.innerHeight-0.5)*30;
  spaceship.style.transform=`
    translateX(calc(-50% + ${x}px))
    translateY(calc(-50% + ${y}px))
    rotateX(${15+y*0.5}deg)
    rotateY(${-20+x*0.5}deg)
    rotateZ(5deg)
  `;
});

// Reset on mouse leave
document.addEventListener('mouseleave',()=>{
  spaceship.style.transition='transform 0.3s ease-out';
  spaceship.style.transform=`
    translateX(-50%)
    translateY(-50%)
    rotateX(15deg)
    rotateY(-20deg)
    rotateZ(5deg)
  `;
  setTimeout(()=>{
    spaceship.style.transition='none';
  },300);
});
</script>

</body>
</html>
